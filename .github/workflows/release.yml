name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.3）'
        required: true
        default: 'v1.0.3'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $version
          git push origin $version

      - name: Build launcher EXE
        shell: pwsh
        run: .\tools\Build_LauncherExe.ps1

      - name: Package release ZIP
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}" }
          $zipName = "RBR_Install_Tool_$version.zip"
          $include = @("启动安装助手.bat", "RBR_Install_Assistant.exe", "README.md", "scripts", "assets")
          Compress-Archive -Path $include -DestinationPath $zipName

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          files: RBR_Install_Tool_*.zip
          generate_release_notes: true
