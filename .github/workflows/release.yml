name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.3）'
        required: true
        default: 'v1.0.3'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "value=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.ver.outputs.value }}
          git push origin ${{ steps.ver.outputs.value }}

      - name: Build launcher EXE
        shell: pwsh
        run: .\tools\Build_LauncherExe.ps1

      - name: Package release ZIP
        shell: pwsh
        run: |
          $zipName = "RBR_Install_Tool_${{ steps.ver.outputs.value }}.zip"
          $include = @("启动安装助手.bat", "RBR_Install_Assistant.exe", "README.md", "scripts", "assets")
          Compress-Archive -Path $include -DestinationPath $zipName

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.value }}
          files: RBR_Install_Tool_*.zip
          generate_release_notes: true
