name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.2.0）'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build launcher EXE
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Build_LauncherExe.ps1

      - name: Create tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.version }}"
          $exists = git tag -l $tag
          if ($exists) {
            Write-Host "Tag $tag already exists, skipping."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
          }

      - name: Package release ZIP
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          $include = [System.Collections.Generic.List[string]]@(
            "启动安装助手.bat", "RBR_Install_Assistant.exe", "README.md",
            "scripts", "assets", "dist", "JSGAME"
          )
          Get-ChildItem -Filter "RBRi18n*.zip" | ForEach-Object { $include.Add($_.Name) }
          Compress-Archive -Path $include -DestinationPath "RBR_Install_Tool_${ver}.zip"

      - name: Create GitHub Release
        shell: pwsh
        run: gh release create ${{ github.event.inputs.version }} RBR_Install_Tool_*.zip --generate-notes --title ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
