name: Build EXE

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build launcher EXE
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\Build_LauncherExe.ps1

      - name: Commit updated EXE
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RBR_Install_Assistant.exe dist/RBR_Install_Assistant.exe
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
          } else {
            git commit -m "chore: auto-build EXE [skip ci]"
            git push
          }
